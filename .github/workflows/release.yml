# Builds the release zip on GitHub's machines, never on a dev box: the same
# build and tests as ci.yml, then tools\package.ps1 (and tools/package.sh for
# Linux). Pushing a tag v* publishes a GitHub release with both. Starting it
# by hand (Actions, "Run workflow"), or a pull request that changes the
# packaging, is a dry run that keeps them as the run's artifacts.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    paths: ['.github/workflows/release.yml', 'tools/package.ps1', 'tools/package.sh', 'tools/check-package.py']

permissions:
  contents: write

jobs:
  windows:
    name: build, test and package (Windows)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Cache the llama.cpp release
        uses: actions/cache@v4
        with:
          path: third_party
          key: llama-b10944-${{ hashFiles('tools/fetch-llama.ps1') }}

      - name: Vulkan loader and a software Vulkan device
        uses: jakoch/install-vulkan-sdk-action@v1.6.0
        with:
          vulkan_version: 1.4.313.0
          install_runtime_only: true
          install_lavapipe: true
          cache: true

      - name: Put the Vulkan loader on PATH
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "$env:VULKAN_SDK\$env:VULKAN_VERSION\runtime\x64"

      - name: Build and test
        shell: cmd
        env:
          GGML_VK_VISIBLE_DEVICES: "0"
          GGML_VK_DISABLE_F16: "1"
          GGML_VK_DISABLE_COOPMAT: "1"
          GGML_XDNA_PINNED: "0"
        run: build.cmd

      - name: Package
        id: package
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "dev-$($env:GITHUB_SHA.Substring(0, 7))" }
          tools\package.ps1 -Version $v
          "name=zest-$v-llama-b10944-win-x64" >> $env:GITHUB_OUTPUT

      - name: Check the extracted package and both commands
        shell: pwsh
        env:
          GGML_VK_VISIBLE_DEVICES: "0"
          GGML_VK_DISABLE_F16: "1"
          GGML_VK_DISABLE_COOPMAT: "1"
          GGML_XDNA_PINNED: "0"
        run: |
          $unpacked = Join-Path $env:RUNNER_TEMP 'zest-package-check'
          Expand-Archive -LiteralPath "dist/${{ steps.package.outputs.name }}.zip" -DestinationPath $unpacked
          python tools/check-package.py $unpacked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Keep the zip with this run
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            dist/${{ steps.package.outputs.name }}.zip
            dist/${{ steps.package.outputs.name }}.zip.sha256

  linux:
    name: build, test and package (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Cache the llama.cpp release
        uses: actions/cache@v4
        with:
          path: third_party
          key: llama-b10944-linux-${{ hashFiles('tools/fetch-llama.sh') }}

      - name: Build tools and a software Vulkan device
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build uuid-dev libvulkan1 mesa-vulkan-drivers

      - name: Build and test
        env:
          GGML_VK_VISIBLE_DEVICES: "0"
          GGML_VK_DISABLE_F16: "1"
          GGML_VK_DISABLE_COOPMAT: "1"
          GGML_XDNA_PINNED: "0"
        run: ./build.sh

      - name: Package
        id: package
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then v=$GITHUB_REF_NAME; else v=dev-${GITHUB_SHA::7}; fi
          tools/package.sh "$v"
          echo "name=zest-$v-llama-b10944-ubuntu-x64" >> "$GITHUB_OUTPUT"

      - name: Check the extracted package and both commands
        env:
          GGML_VK_VISIBLE_DEVICES: "0"
          GGML_VK_DISABLE_F16: "1"
          GGML_VK_DISABLE_COOPMAT: "1"
          GGML_XDNA_PINNED: "0"
        run: |
          unpacked=$(mktemp -d)
          tar -xzf "dist/${{ steps.package.outputs.name }}.tar.gz" -C "$unpacked"
          python3 tools/check-package.py "$unpacked/${{ steps.package.outputs.name }}"

      - name: Keep the archive with this run
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            dist/${{ steps.package.outputs.name }}.tar.gz
            dist/${{ steps.package.outputs.name }}.tar.gz.sha256

  publish:
    name: publish the release
    if: github.ref_type == 'tag'
    needs: [windows, linux]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Fetch both packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_flags=()
          # RC packages can be checked on NPU hardware before publication.
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_flags+=(--prerelease --draft)
          else
            release_flags+=(--latest)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Zest $GITHUB_REF_NAME" --notes-file .github/release-notes.md "${release_flags[@]}"
